{% extends "layout.html" %}
{% block title %}Shop queue{% endblock %}
{% block body %}
<style>
  /* Shop-floor use: big touch targets, coarse layout. */
  .tabs { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .tab {
    padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #d1d5db;
    background: #fff; color: #374151; font-size: 1rem; cursor: pointer;
    text-decoration: none; font-weight: 600;
  }
  .tab:hover { background: #f3f4f6; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .count { font-size: 0.85rem; opacity: 0.8; margin-left: 0.25rem; }
  .pick-card {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 0.75rem; padding: 1rem 1.25rem;
    border: 1px solid #e5e7eb; border-radius: 10px;
    margin-bottom: 0.75rem; background: #fff;
  }
  .pick-card .top-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .quote-number { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
  .customer-name { font-weight: 600; font-size: 1.05rem; }
  .meta { font-size: 0.95rem; color: #6b7280; display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.25rem; }
  .status-badge {
    display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
  }
  .picklist-queued { background: #fef3c7; color: #92400e; }
  .picklist-picked { background: #dbeafe; color: #1d4ed8; }
  .picklist-loaded { background: #e0e7ff; color: #3730a3; }
  .picklist-shipped { background: #dcfce7; color: #166534; }
  .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .advance-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 0.8rem 1.4rem; border-radius: 10px;
    font-weight: 700; font-size: 1.05rem; cursor: pointer; min-width: 9.5rem;
  }
  .sheet-link {
    background: #f3f4f6; border: 1px solid #d1d5db; color: #111827;
    padding: 0.8rem 1.1rem; border-radius: 10px; font-weight: 600;
    text-decoration: none; font-size: 1rem;
  }
  .row-notice { grid-column: 1 / -1; font-size: 0.95rem; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 0.5rem 0.8rem; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: #9ca3af; font-size: 1.05rem; }
</style>

<h1 style="margin:0 0 1rem;">Shop queue</h1>

<div id="picklists-container">
  <div class="tabs">
    {% for tab in tabs %}
    <a class="tab{% if tab.key == active_status %} active{% endif %}"
       href="#"
       hx-get="/pick-lists/?status={{ tab.key }}"
       hx-target="#picklists-body"
       hx-select="#picklists-body"
       hx-swap="outerHTML"
       hx-push-url="/pick-lists/?status={{ tab.key }}">
      {{ tab.label }} <span class="count">({{ tab.count }})</span>
    </a>
    {% endfor %}
  </div>

  {% include "fulfillment/_queue_body.html" %}
</div>
{% endblock %}
