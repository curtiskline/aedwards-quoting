{% extends "layout.html" %}
{% block title %}Orders{% endblock %}
{% block body %}
<style>
  .tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .tab {
    padding: 0.4rem 0.75rem; border-radius: 6px; border: 1px solid #d1d5db;
    background: #fff; color: #374151; font-size: 0.875rem; cursor: pointer;
    text-decoration: none; font-weight: 500;
  }
  .tab:hover { background: #f3f4f6; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .count { font-size: 0.75rem; opacity: 0.8; margin-left: 0.25rem; }
  .order-card {
    display: grid; grid-template-columns: 1fr auto;
    gap: 0.5rem; padding: 0.75rem 1rem;
    border: 1px solid #e5e7eb; border-radius: 8px;
    margin-bottom: 0.5rem; background: #fff;
    transition: box-shadow 0.15s;
  }
  .order-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .order-card .top-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .quote-number { font-weight: 700; color: var(--accent); }
  .customer-name { font-weight: 500; }
  .meta { font-size: 0.85rem; color: #6b7280; display: flex; gap: 1rem; flex-wrap: wrap; }
  .status-badge {
    display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  }
  .status-accepted { background: #dcfce7; color: #166534; }
  .status-ordered { background: #dbeafe; color: #1d4ed8; }
  .status-fulfilled { background: #f3f4f6; color: #374151; }
  .amount { font-weight: 600; text-align: right; white-space: nowrap; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: #9ca3af; }
</style>

<h1 style="margin:0 0 1rem;">Orders</h1>

<div id="orders-container">
  <div class="tabs">
    {% for tab in tabs %}
    <a class="tab{% if tab.key == active_status %} active{% endif %}"
       href="#"
       hx-get="/orders/?status={{ tab.key }}"
       hx-target="#orders-body"
       hx-select="#orders-body"
       hx-swap="outerHTML"
       hx-push-url="/orders/?status={{ tab.key }}">
      {{ tab.label }} <span class="count">({{ tab.count }})</span>
    </a>
    {% endfor %}
  </div>

  {% include "orders/_queue_body.html" %}
</div>
{% endblock %}
